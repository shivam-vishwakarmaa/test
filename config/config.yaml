# Hiver take-home -- pipeline configuration.
# Every number in the README is produced by running the pipeline with this file.

brand: hulu_support
seed: 20260909

paths:
  raw_csv: data/raw/twcs.csv
  interim_dir: data/interim
  golden: data/golden/golden_v1.jsonl
  artifacts: artifacts

data:
  # A brand thread must have >= this many words in the opening to count as a case.
  min_opening_words: 4
  min_ascii_ratio: 0.85

embedding:
  # 'ollama' = nomic-embed-text (local, free, semantic).
  # 'tfidf'  = deterministic offline fallback so graders need no daemon.
  backend: ollama
  model: nomic-embed-text
  tfidf_dim: 256

retrieval:
  k: 6
  # Only ground on historical replies that actually said something. See
  # docs/DECISIONS.md #7 -- grounding on link-only deflections teaches the
  # drafter to deflect.
  min_reply_words: 8
  exclude_deflections: true

llm:
  # 'cached' replays committed artifacts so the headline numbers reproduce
  # offline in minutes with no key -- the safe default that never spends
  # money or quota just because someone ran a script. 'gemini' and
  # 'anthropic' make real API calls; 'ollama' is a fully local fallback.
  # Override per-run with the LLM_BACKEND env var (see README / Makefile)
  # rather than editing this file for a one-off run.
  backend: cached
  cache_dir: artifacts/llm_cache
  max_retries: 4
  timeout_s: 120
  ollama_url: http://localhost:11434
  ollama_model: qwen2.5:3b

agent:
  # Support automation is volume-bound: a production Hulu queue is tens of
  # thousands of tickets a week, so the deployable choice is the cheapest model
  # that clears the quality bar, not the strongest one. gemini-2.5-flash is
  # the default for this submission (Decision #16 -- a GEMINI_API_KEY was
  # supplied for this run); claude-haiku-4-5 is the equivalent choice on the
  # 'anthropic' backend. Override with AGENT_MODEL for an ablation.
  model: gemini-2.5-flash
  temperature: 0.0
  max_tokens: 1024
  n_few_shot: 8

judge:
  # Deliberately a DIFFERENT model from the drafter, to avoid the
  # self-enhancement bias where an LLM judge scores its own family's outputs
  # higher (see docs/REPORT.md section 4). The intended design is also a
  # STRONGER tier (Haiku drafts, Opus judges, on the 'anthropic' backend);
  # on 'gemini' this run's free-tier API key has zero quota on every pro-tier
  # model (verified: gemini-2.5-pro and gemini-3.1-pro-preview both return
  # HTTP 429 RESOURCE_EXHAUSTED), so the judge here is gemini-3.5-flash: a
  # different model generation from the gemini-2.5-flash drafter, but the
  # same provider and tier -- a materially weaker bias mitigation than the
  # Anthropic pairing. This is a known, stated limitation, not a hidden one
  # -- see Decision #18 and REPORT.md section 4.
  model: gemini-3.5-flash
  temperature: 0.0
  max_tokens: 1024
  # Each reply is judged twice with the rubric criteria in reversed order to
  # measure order sensitivity.
  double_score_for_consistency: true

triage:
  # Intents the agent is never allowed to auto-send, regardless of confidence.
  never_auto_intents:
    - billing_payment
    - account_access
    - cancel_refund
  # Auto-send requires classifier confidence at or above this AND a groundedness
  # score at or above `min_grounding`. Tuned on dev, reported on test.
  min_confidence: 0.75
  min_grounding: 3
